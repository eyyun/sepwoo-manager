name: Build & Release Sepwoo Manager

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks app/src/main/assets/sepwoo_signer.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:sepwoo123 \
            --key-pass pass:sepwoo123 \
            --out Sepwoo-Manager.apk \
            app-release-aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: Sepwoo Manager ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          body: |
            ### Sepwoo Manager — Sinewix PLUS Yerel APK Yamalayıcı
            - Resmi SineWix APK dosyasını cihazda yerel olarak yamalar (`cronus.best` üzerinden yama çeker)
            - İsim & ikon özelleştirme ve boyut optimizasyonu içerir
          files: Sepwoo-Manager.apk
